name: bootstrap_italia_flutter
description: Bootstrap Italia design system for Flutter — PA-compliant UI components for Italian government apps.
version: 0.1.0

# Not published. This is an unofficial community port offered as a possible
# contribution to Developers Italia, not a product competing with the official
# design system. `publish_to: none` makes an accidental `dart pub publish`
# impossible, which also means the `bootstrap_italia` name on pub.dev — the
# official design system's name — stays unclaimed.
publish_to: none

# homepage/repository/issue_tracker deliberately omitted: there is no public
# repository yet. They previously pointed at github.com/nicoursi/... , which
# 404s and is not this project — publishing that would have sent users' bug
# reports to an unrelated account.

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  bootstrap_italia_icons: ^0.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  # Font licences must ship with the binaries (OFL 1.1 / Apache-2.0).
  assets:
    - fonts/licenses/
  fonts:
    - family: TitilliumWeb
      fonts:
        - asset: fonts/TitilliumWeb-Light.ttf
          weight: 300
        - asset: fonts/TitilliumWeb-Regular.ttf
          weight: 400
        - asset: fonts/TitilliumWeb-SemiBold.ttf
          weight: 600
        - asset: fonts/TitilliumWeb-Bold.ttf
          weight: 700
        - asset: fonts/TitilliumWeb-LightItalic.ttf
          weight: 300
          style: italic
        - asset: fonts/TitilliumWeb-Italic.ttf
          weight: 400
          style: italic
        - asset: fonts/TitilliumWeb-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: fonts/TitilliumWeb-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Lora
      fonts:
        - asset: fonts/Lora-Regular.ttf
          weight: 400
        - asset: fonts/Lora-Italic.ttf
          weight: 400
          style: italic
    - family: RobotoMono
      fonts:
        - asset: fonts/RobotoMono-Regular.ttf
          weight: 400
        - asset: fonts/RobotoMono-Italic.ttf
          weight: 400
          style: italic
