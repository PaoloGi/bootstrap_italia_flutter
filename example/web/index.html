<!DOCTYPE html>
<html>
<head>
  <!-- Declared explicitly, because Flutter injects its own otherwise:
       `maximum-scale=1.0, user-scalable=no`, which disables pinch-zoom. That
       is a WCAG 1.4.4 (Resize Text) failure, and for an Italian PA service it
       is a legal one — Legge 4/2004 via EN 301 549. The engine only injects
       when the document declares none, so this line is the whole fix. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="bootstrap_italia_example">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>bootstrap_italia_example</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Flutter's engine rewrites the viewport meta AFTER boot, appending
    // `maximum-scale=1.0, user-scalable=no` even when the document declares
    // its own. That disables pinch-zoom, which is a WCAG 1.4.4 failure — and
    // for an Italian PA service a legal one. Declaring the meta is not enough;
    // it has to be put back whenever the engine touches it.
    (function () {
      var WANTED = 'width=device-width, initial-scale=1.0';
      function restore() {
        var m = document.querySelector('meta[name="viewport"]');
        if (m && m.getAttribute('content') !== WANTED) {
          m.setAttribute('content', WANTED);
        }
      }
      new MutationObserver(restore).observe(document.head, {
        attributes: true, childList: true, subtree: true,
      });
      restore();
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
