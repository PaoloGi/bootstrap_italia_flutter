name: bootstrap_italia_flutter
description: Unofficial Flutter port of Bootstrap Italia, the design system for Italian public administration.
version: 0.1.1

# An unofficial community port, offered as a possible contribution to
# Developers Italia rather than as a product competing with the official design
# system. The `_flutter` suffix is the whole of the claim: `bootstrap_italia`
# on pub.dev — the design system's own name — stays unclaimed, and NOTICE.md
# says so in full.
#
# `publish_to: none` stood here until the package was ready to go out, which
# also made an accidental `dart pub publish` impossible. It is gone because
# publishing is now deliberate.

# These three were omitted for as long as there was no repository to name, and
# before that pointed at github.com/nicoursi/... , which 404s and is not this
# project — publishing that would have sent users' bug reports to an unrelated
# account. The repository now exists, so they say where the code is and where a
# conformance question should arrive.
repository: https://github.com/PaoloGi/bootstrap_italia_flutter
homepage: https://github.com/PaoloGi/bootstrap_italia_flutter
issue_tracker: https://github.com/PaoloGi/bootstrap_italia_flutter/issues

# Shown as a gallery on the package's pub.dev page. Rendered by
# tool/screenshots/readme_shots_test.dart at a phone's width, which is where
# this package is used; the descriptions are what a screen reader announces in
# place of each image, so they describe the screen rather than naming the file.
screenshots:
  - description: >-
      A phone screen built from the kit: the centre header over a breadcrumb, a
      service card, and the bottom navigation bar with an unread badge.
    path: screenshots/navigation.png
  - description: >-
      A form at phone width — a filled text field with its floating label, a
      select, a field showing a validation error and its message, a checkbox
      and a toggle.
    path: screenshots/form.png
  - description: >-
      An autocomplete with its suggestion list open, the typed prefix
      emphasised in each result.
    path: screenshots/autocomplete.png
  - description: >-
      The mobile navigation panel the megamenu opens, with one section
      expanded over its links and two collapsed below it.
    path: screenshots/megamenu.png
  - description: >-
      Buttons: a block primary, a block outline with an icon, a small
      secondary beside a disabled one, and a button in its loading state.
    path: screenshots/buttons.png
  - description: >-
      Feedback components: a success alert, a warning callout, badges, a
      dismissible chip and a spinner.
    path: screenshots/feedback.png

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  bootstrap_italia_icons: ^0.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  # Font licences must ship with the binaries (SIL OFL 1.1, all three
  # families — see fonts/licenses/README.md).
  assets:
    - fonts/licenses/
  fonts:
    - family: TitilliumWeb
      fonts:
        - asset: fonts/TitilliumWeb-Light.ttf
          weight: 300
        - asset: fonts/TitilliumWeb-Regular.ttf
          weight: 400
        - asset: fonts/TitilliumWeb-SemiBold.ttf
          weight: 600
        - asset: fonts/TitilliumWeb-Bold.ttf
          weight: 700
        - asset: fonts/TitilliumWeb-LightItalic.ttf
          weight: 300
          style: italic
        - asset: fonts/TitilliumWeb-Italic.ttf
          weight: 400
          style: italic
        - asset: fonts/TitilliumWeb-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: fonts/TitilliumWeb-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Lora
      fonts:
        - asset: fonts/Lora-Regular.ttf
          weight: 400
        - asset: fonts/Lora-Italic.ttf
          weight: 400
          style: italic
    - family: RobotoMono
      fonts:
        - asset: fonts/RobotoMono-Regular.ttf
          weight: 400
        - asset: fonts/RobotoMono-Italic.ttf
          weight: 400
          style: italic
