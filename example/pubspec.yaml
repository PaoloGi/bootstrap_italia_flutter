name: bootstrap_italia_example
description: Catalog app showcasing Bootstrap Italia Flutter components.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  bootstrap_italia_icons: ^0.0.3
  flutter:
    sdk: flutter
  # Material's OWN strings for it/de/fr. The package needs none of this — it
  # ships its own table and falls back to Italian with no delegate at all — but
  # an app that declares `supportedLocales: [it, de, fr]` is promising that
  # every delegate can serve those locales, and Material cannot without this.
  # It is a dependency of the example, not of the package.
  flutter_localizations:
    sdk: flutter
  bootstrap_italia_flutter:
    path: ../

flutter:
  uses-material-design: true

  # CanvasKit — Flutter's web renderer — downloads Roboto regular from
  # fonts.gstatic.com at startup unless the app declares a family named exactly
  # `Roboto`, because Roboto is its built-in default face. That request would
  # break the "offline, no third-party requests" promise the README makes. The
  # package cannot make this declaration for its consumers: bundled families
  # are namespaced as `packages/bootstrap_italia_flutter/Roboto`, and the
  # engine matches the bare string.
  #
  # See fonts/licenses/README.md for the licence, and
  # tool/visual_parity/playwright/soak.mjs for the check that fails if a
  # request to fonts.gstatic.com comes back.
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
  # Licence texts must ship with the binaries in every build of the app, not
  # only in the repository.
  assets:
    - fonts/licenses/

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device evidence for the package. `integration_test` rather than Patrol:
  # the kit is a widget library with no native dialogs to drive, and Patrol's
  # value is exactly those — it would cost an XCUITest target and an Android
  # instrumentation runner to assert the same Flutter-level facts.
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
